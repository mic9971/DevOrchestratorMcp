name: real-github-e2e

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  real-github-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore DevOrchestratorMcp.sln

      - name: Build
        run: dotnet build DevOrchestratorMcp.sln -c Release --no-restore

      - name: Run real GitHub contract E2E
        env:
          DEVORCHESTRATOR_REAL_GITHUB_E2E_REPOSITORY_URL: https://github.com/${{ github.repository }}
          DEVORCHESTRATOR_REAL_GITHUB_E2E_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
        run: >-
          dotnet test tests/DevOrchestrator.Architecture.Tests/DevOrchestrator.Architecture.Tests.csproj
          -c Release --no-build
          --filter FullyQualifiedName~RealGitHubWorkflowTests
