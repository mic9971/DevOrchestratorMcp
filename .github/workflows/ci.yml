name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: devorchestrator_test
          POSTGRES_USER: devorchestrator
          POSTGRES_PASSWORD: devorchestrator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devorchestrator -d devorchestrator_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore DevOrchestratorMcp.sln

      - name: Build
        run: dotnet build DevOrchestratorMcp.sln -c Release --no-restore

      - name: Run explicit PostgreSQL migration
        env:
          Database__Provider: postgres
          ConnectionStrings__Orchestrator: "Host=127.0.0.1;Port=5432;Database=devorchestrator_test;Username=devorchestrator;Password=devorchestrator"
        run: dotnet run --project src/DevOrchestrator.McpServer/DevOrchestrator.McpServer.csproj -c Release --no-build -- migrate

      - name: Test
        env:
          DEVORCHESTRATOR_POSTGRES_TEST: "Host=127.0.0.1;Port=5432;Database=devorchestrator_test;Username=devorchestrator;Password=devorchestrator"
        run: dotnet test DevOrchestratorMcp.sln -c Release --no-build

      - name: Validate production compose
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          DEVORCHESTRATOR_ARCHITECT_KEY: ci-architect-key
          DEVORCHESTRATOR_IMPLEMENTER_KEY: ci-implementer-key
          DEVORCHESTRATOR_AUDITOR_KEY: ci-auditor-key
          GITHUB_TOKEN: ci-github-token
          GITHUB_WEBHOOK_SECRET: ci-webhook-secret
        run: docker compose -f compose.yaml config --quiet
