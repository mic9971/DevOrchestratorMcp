name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore DevOrchestratorMcp.sln

      - name: Build
        run: dotnet build DevOrchestratorMcp.sln -c Release --no-restore

      - name: Test
        run: dotnet test DevOrchestratorMcp.sln -c Release --no-build

      - name: Validate production compose
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          DEVORCHESTRATOR_ARCHITECT_KEY: ci-architect-key
          DEVORCHESTRATOR_IMPLEMENTER_KEY: ci-implementer-key
          DEVORCHESTRATOR_AUDITOR_KEY: ci-auditor-key
          GITHUB_TOKEN: ci-github-token
          GITHUB_WEBHOOK_SECRET: ci-webhook-secret
        run: docker compose -f compose.yaml config --quiet
