services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: devorchestrator
      POSTGRES_USER: devorchestrator
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-devorchestrator}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devorchestrator -d devorchestrator"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  db-migrate:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    command: ["migrate"]
    environment:
      Database__Provider: postgres
      ConnectionStrings__Orchestrator: "Host=postgres;Port=5432;Database=devorchestrator;Username=devorchestrator;Password=${POSTGRES_PASSWORD:-devorchestrator}"
    restart: "no"

  dev-orchestrator:
    build:
      context: .
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    ports:
      - "5058:8080"
    environment:
      Database__Provider: postgres
      ConnectionStrings__Orchestrator: "Host=postgres;Port=5432;Database=devorchestrator;Username=devorchestrator;Password=${POSTGRES_PASSWORD:-devorchestrator}"
      Security__RequireAuthentication: "true"
      Security__ArchitectKey: "${DEVORCHESTRATOR_ARCHITECT_KEY}"
      Security__ImplementerKey: "${DEVORCHESTRATOR_IMPLEMENTER_KEY}"
      Security__AuditorKey: "${DEVORCHESTRATOR_AUDITOR_KEY}"
      GitHub__Token: "${GITHUB_TOKEN}"
      GitHub__WebhookSecret: "${GITHUB_WEBHOOK_SECRET}"
      GitHub__WebhookMaxAttempts: "${GITHUB_WEBHOOK_MAX_ATTEMPTS:-8}"
      AllowedHosts: "${DEVORCHESTRATOR_ALLOWED_HOSTS:-localhost;127.0.0.1}"

volumes:
  postgres-data:
